# Oracle MySQL 8.4.11 installed-package live qualification manifest
#
# Run the complete validation and live qualification sequence with:
#   ./qualification/mysql-uds-observation/run-qualification.sh
#
# The runner generates a temporary concrete manifest from these documented
# inputs after producing the required current validation receipts.
#
# The harness never invokes the system MySQL service, downloads packages, or
# accepts reusable credentials. It launches this exact executable as its own
# recorded child with project-local data/runtime directories and a private UDS.

mysqld_path = "/usr/sbin/mysqld"
# Oracle's Ubuntu package installs an AppArmor attachment for /usr/sbin/mysqld
# that denies project-local data. aa-exec performs a per-child transition only;
# it does not edit/reload profiles or touch the system service.
apparmor_exec_path = "/usr/bin/aa-exec"
package_name = "mysql-community-server-core"
package_version = "8.4.11-1ubuntu24.04"
apt_repository_host = "repo.mysql.com"
apt_repository_component = "mysql-8.4-lts"

# Replace with the exact SHA-256 of the package-owned executable.
expected_mysqld_sha256 = "5319F31BABC80A5B438C4C4E87292539818A3F0D737CFF6733FF8AAE7D801058"

# Both paths must be absolute and beneath this repository's qualification/ tree.
qualification_root = "/absolute/path/to/kuberic-mysql/qualification/q"

# Must be outside qualification_root/work.
output_record_path = "/absolute/path/to/kuberic-mysql/qualification/mysql-uds-observation/oracle-mysql-8.4.11.toml"
validation_receipt_dir = "/absolute/path/to/kuberic-mysql/qualification/mysql-uds-observation/.receipts"
feature_graph_path = "/absolute/path/to/kuberic-mysql/qualification/mysql-uds-observation/.receipts/feature-graph.txt"

startup_timeout_ms = 30000
observation_timeout_ms = 5000
cleanup_timeout_ms = 10000
