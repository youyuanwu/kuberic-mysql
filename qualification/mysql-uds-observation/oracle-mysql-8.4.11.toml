[[query]]
id = "Mysql8411ProductIdentityV1"
sql = "SELECT @@version AS version, @@version_comment AS version_comment, @@version_compile_machine AS version_compile_machine, @@version_compile_os AS version_compile_os, @@GLOBAL.server_uuid AS server_uuid"
columns = ["version:VarString:nullable=true", "version_comment:VarString:nullable=true", "version_compile_machine:VarString:nullable=true", "version_compile_os:VarString:nullable=true", "server_uuid:VarString:nullable=true"]

[[query]]
id = "Mysql8411LocalStateV1"
sql = "SELECT @@GLOBAL.group_replication_group_name AS group_name, @@GLOBAL.group_replication_local_address AS group_replication_address, @@GLOBAL.read_only AS read_only, @@GLOBAL.super_read_only AS super_read_only"
columns = ["group_name:VarString:nullable=true", "group_replication_address:VarString:nullable=true", "read_only:LongLong:nullable=true", "super_read_only:LongLong:nullable=true"]

[[query]]
id = "Mysql8411GroupMembersV1"
sql = "SELECT MEMBER_ID AS member_id, MEMBER_HOST AS member_host, MEMBER_PORT AS member_port, MEMBER_STATE AS member_state, MEMBER_ROLE AS member_role FROM performance_schema.replication_group_members ORDER BY MEMBER_ID"
columns = ["member_id:String:nullable=false", "member_host:String:nullable=false", "member_port:Long:nullable=true", "member_state:String:nullable=false", "member_role:String:nullable=false"]

[[query]]
id = "Mysql8411LocalMemberStatsV1"
sql = "SELECT MEMBER_ID AS member_id, VIEW_ID AS view_id FROM performance_schema.replication_group_member_stats WHERE MEMBER_ID = @@GLOBAL.server_uuid"
columns = ["member_id:String:nullable=false", "view_id:String:nullable=false"]

[[query]]
id = "Mysql8411ExecutedGtidsV1"
sql = "SELECT @@GLOBAL.gtid_executed AS gtid_executed"
columns = ["gtid_executed:VarString:nullable=true"]

