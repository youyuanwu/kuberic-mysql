name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --offline --workspace --all-features -- --test-threads=1

      - name: Run Clippy
        run: cargo clippy --locked --offline --workspace --all-targets --all-features -- -D warnings

      - name: Inspect dependency tree
        run: cargo tree --locked --offline --workspace --edges normal,build,dev
