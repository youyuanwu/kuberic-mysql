name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: always

jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install exact Oracle MySQL 8.4.11 package
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-utils ca-certificates gnupg wget
          wget --quiet https://dev.mysql.com/get/mysql-apt-config_0.8.39-1_all.deb
          echo "mysql-apt-config mysql-apt-config/select-server select mysql-8.4-lts" |
            sudo debconf-set-selections
          echo "mysql-apt-config mysql-apt-config/select-product select Ok" |
            sudo debconf-set-selections
          sudo dpkg --install mysql-apt-config_0.8.39-1_all.deb
          rm mysql-apt-config_0.8.39-1_all.deb
          grep --quiet 'mysql-8.4-lts' /etc/apt/sources.list.d/mysql.list
          sudo apt-get update
          sudo apt-get install --yes mysql-community-server-core=8.4.11-1ubuntu24.04
          sudo systemctl disable --now mysql.service || true
          test "$(systemctl is-active mysql.service || true)" != active

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run workspace tests
        run: cargo test --locked --offline --workspace --all-features -- --test-threads=1

      - name: Run Clippy
        run: cargo clippy --locked --offline --workspace --all-targets --all-features -- -D warnings

      - name: Run live MySQL qualification
        run: |
          cargo test --locked --offline -p kuberic-mysql-adapter \
            --features live-mysql-8-4-11 --test live_mysql_8_4_11 \
            qualify_oracle_mysql_8_4_11 -- --ignored --exact --test-threads=1
