[package]
name = "kuberic-mysql"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = { version = "0.1", optional = true }
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic", rev = "ceec5887ad97d71222117610428ce715b782777e", optional = true, default-features = false, features = ["host"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
rustix = { version = "1.1.5", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }

[features]
kuberic-public-v1 = ["dep:async-trait", "dep:kuberic-runtime"]

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "test-util"] }

[lints]
workspace = true
