[package]
name = "kuberic-mysql"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1"
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic", rev = "996dc487b85450ca25f68a3b9b9c22869e58f12b", default-features = false, features = ["host"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
rustix = { version = "1.1.5", features = ["fs"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "sync"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "test-util"] }

[lints]
workspace = true
