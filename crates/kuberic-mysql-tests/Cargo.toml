[package]
name = "kuberic-mysql-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
kuberic-mysql = { path = "../kuberic-mysql" }
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic", rev = "8c659536bdf31040aa13d787427ff1601e261bf5", default-features = false, features = ["host", "testing"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "test-util"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport"] }

[lints]
workspace = true
