[package]
name = "kuberic-mysql-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
kuberic-mysql = { path = "../kuberic-mysql" }
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic", rev = "ceec5887ad97d71222117610428ce715b782777e", default-features = false, features = ["host"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "io-util", "test-util"] }

[lints]
workspace = true
