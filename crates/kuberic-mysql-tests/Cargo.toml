[package]
name = "kuberic-mysql-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
kuberic-controller = { git = "https://github.com/youyuanwu/kuberic", rev = "e2a47b6c631c974aa0135e81c3a7e3a439980ded", default-features = false, features = ["test-util"] }
kuberic-mysql = { path = "../kuberic-mysql" }
kuberic-runtime = { git = "https://github.com/youyuanwu/kuberic", rev = "e2a47b6c631c974aa0135e81c3a7e3a439980ded", default-features = false, features = ["host", "testing"] }
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "io-util", "test-util"] }
tonic = { version = "=0.14.6", default-features = false, features = ["transport"] }

[lints]
workspace = true
