range = "Item_func_get_system_var::resolve_type, lines 7104-7143"
derivation = "Every selected @@ system-variable expression calls set_nullable(true). SHOW_CHAR-family variables use set_data_type_string rather than fixed CHAR metadata; integer and boolean variables use LONGLONG."

