[workspace]
members = [
    "crates/kuberic-mysql-adapter",
    "crates/kuberic-mysql-core",
    "crates/kuberic-mysql-service",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-mysql"
rust-version = "1.95"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
